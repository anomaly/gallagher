[project]
name = "gallagher"
version = "1.0.0b1"
description = "The missing developer toolkit for Gallagher Command Centre"
authors = [{ name = "Anomaly", email = "oss@anomaly.ltd" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic (>=2.11.5,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.12.0",
]

[project.scripts]
gala = "gallagher.cli.__main__:main"
gala-mcp-server = "gallagher.mcp.server.__main__:main"
gtui = "gallagher.tui.__main__:main"

[project.optional-dependencies]
cli = [
    "asyncer>=0.0.18,<0.0.19",
    "typer>=0.27.0,<0.28.0",
]
mcp = [
    "mcp[cli]>=1.28.1",
    "pydantic-ai>=2.18.0",
]
sync = [
    "alembic>=1.18.5,<2.0.0",
    "shillelagh>=1.4.4,<2.0.0",
    "sqlalchemy>=2.0.51,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "textual-dev>=1.7.0,<2.0.0",
    "pygments>=2.19.1,<3.0.0",
    "pytest-order>=1.3.0,<2.0.0",
    "pytest-asyncio>=1.0.0",
    "coverage>=7.13.4",
    "zensical>=0.0.42",
    "ruff>=0.16.0",
]
